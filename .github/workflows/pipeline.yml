name: pipeline

on:
  schedule:
    - cron: "0 6 10 * *"   # 10th of each month, 06:00 UTC; StatCan publishes around the 5th
  workflow_dispatch:
    inputs:
      period:
        description: "Period YYYY-MM (default: current month)"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync --no-dev
      - name: Resolve period
        id: period
        run: |
          if [ -n "${{ github.event.inputs.period }}" ]; then echo "value=${{ github.event.inputs.period }}" >> "$GITHUB_OUTPUT";
          else echo "value=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"; fi
      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COMTRADE_KEY: ${{ secrets.COMTRADE_KEY }}
        run: uv run northsource-pipeline run --period "${{ steps.period.outputs.value }}"
      - name: Upload staging parquet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-${{ steps.period.outputs.value }}
          path: data/staging/
          retention-days: 30
