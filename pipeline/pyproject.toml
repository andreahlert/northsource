[project]
name = "northsource-pipeline"
version = "0.1.0"
description = "Data pipeline for northsource: CIMT, CBSA tariff, surtax orders, Comtrade to Postgres"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2,<3",
    "pyarrow>=17",
    "duckdb>=1.1",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pycountry>=24.6",
    "comtradeapicall>=1.3",
    "psycopg[binary]>=3.2",
]

[project.scripts]
northsource-pipeline = "northsource_pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/northsource_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
